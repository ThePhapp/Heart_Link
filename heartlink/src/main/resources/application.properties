spring.application.name=heartlink

# Keep operational endpoints on a separate loopback-only listener by default.
management.server.port=${MANAGEMENT_SERVER_PORT:9091}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoints.access.default=read-only

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/heartlink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway (strict defaults: never auto-baseline unknown non-empty DBs)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Heartlink DB upgrade, schema drift & demo seed guards
app.db.guarded-baseline-enabled=${HEARTLINK_GUARDED_BASELINE:false}
app.db.drift-check-enabled=true
app.seed.demo-enabled=false
app.seed.demo-script=seed/seed.sql

# JWT (dev defaults - override JWT_SECRET outside local dev; must be >= 32 bytes)
app.jwt.secret=${JWT_SECRET:heartlink-dev-secret-change-me-please-32b}
app.jwt.expires-in=3600
app.jwt.refresh-expires-in=604800
