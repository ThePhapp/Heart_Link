name: Heartlink tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heartlink_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heartlink_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit and integration tests
        working-directory: heartlink
        run: ./mvnw -B verify
      - name: Require non-skipped integration tests
        working-directory: heartlink
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/failsafe-reports/TEST-*.xml")
          if not reports:
              raise SystemExit("Failsafe produced no integration reports")
          suites = [ET.parse(path).getroot() for path in reports]
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          print(f"Integration tests: {tests}; skipped: {skipped}; failures: {failures}; errors: {errors}")
          if tests < 20 or skipped or failures or errors:
              raise SystemExit("Integration test report gate failed")
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartlink-test-reports
          path: |
            heartlink/target/surefire-reports/*.xml
            heartlink/target/failsafe-reports/*.xml
          if-no-files-found: warn
